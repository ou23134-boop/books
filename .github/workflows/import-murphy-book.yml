name: Import Murphy financial markets book
on:
  push:
    branches: [main]
    paths: ['.github/workflows/import-murphy-book.yml']
permissions:
  contents: write
jobs:
  import-book:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify the requested PDF
        shell: python
        run: |
          import urllib.request, urllib.parse, hashlib, pathlib
          name = "Technical Analysis of the Financial Markets - A Comprehensive Guide to Trading Methods and Applications 1999.pdf"
          url = "https://raw.githubusercontent.com/bharaniabhishek123/some-investment-books/748612eac597d81570e211961a5eb1da0b275ca6/" + urllib.parse.quote(name)
          data = urllib.request.urlopen(url, timeout=90).read()
          assert data.startswith(b"%PDF-"), "Not a PDF"
          assert len(data) == 21333139, "Unexpected size"
          sha = hashlib.sha1(b"blob " + str(len(data)).encode() + b"\0" + data).hexdigest()
          assert sha == "01c71a947e063fec3697f6669212bd3aaefda547", "Unexpected content"
          target = pathlib.Path("股票投资/技术分析/金融市场技术分析_英文版_1999.pdf")
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_bytes(data)
      - name: Save the book and remove the completed import workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "股票投资/技术分析/金融市场技术分析_英文版_1999.pdf"
          git rm -- .github/workflows/import-murphy-book.yml
          git commit -m "Add verified Murphy financial markets book"
          git push origin HEAD:main
